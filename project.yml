name: WindowPort
options:
  bundleIdPrefix: com.ryanmclean
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  WindowPort:
    type: application
    platform: iOS
    sources:
      - path: WindowPortApp
    info:
      path: WindowPortApp/Info.plist
      properties:
        CFBundleDisplayName: Port
        NSLocalNetworkUsageDescription: Port connects to your Windows computer to show the apps you choose.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanmclean.windowport
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - WindowPortTests
  WindowPortTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WindowPortAppTests
    dependencies:
      - target: WindowPort
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

