name: WindowPort
options:
  bundleIdPrefix: com.ryanmclean
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  WindowPort:
    type: application
    platform: iOS
    sources:
      - path: WindowPortApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanmclean.windowport
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WindowPort
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: WindowPort connects to your Windows computer to show the apps you choose.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - WindowPortTests
  WindowPortTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WindowPortAppTests
    dependencies:
      - target: WindowPort

